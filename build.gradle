plugins {
    id 'io.micronaut.application' version '4.5.4'
    id 'com.gradleup.shadow' version '8.3.9'
}

version = '0.1'
group = 'com.jilali'

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor 'io.micronaut:micronaut-http-validation'
    annotationProcessor 'io.micronaut.serde:micronaut-serde-processor'
    annotationProcessor 'io.micronaut.validation:micronaut-validation-processor'
    annotationProcessor 'io.micronaut.openapi:micronaut-openapi'

    implementation 'io.micronaut:micronaut-http-server-netty'
    implementation 'io.micronaut:micronaut-http-client'
    implementation 'io.micronaut:micronaut-websocket'
    implementation 'io.micronaut:micronaut-retry'
    implementation 'io.micronaut.serde:micronaut-serde-jackson'
    implementation 'io.micronaut:micronaut-jackson-databind'
    implementation 'io.micronaut.validation:micronaut-validation'
    implementation 'io.micronaut.openapi:micronaut-openapi'
    implementation 'io.micronaut.cache:micronaut-cache-caffeine'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'
    implementation 'io.projectreactor:reactor-core'
    implementation 'io.micronaut.sql:micronaut-jdbc-hikari'
    implementation 'at.favre.lib:bcrypt:0.10.2'

    runtimeOnly 'ch.qos.logback:logback-classic'
    runtimeOnly 'org.yaml:snakeyaml'
    // SQLite support in Micronaut uses the same micronaut-jdbc-hikari (already on the
    // classpath via implementation above) plus the Xerial SQLite JDBC driver. There is no
    // standalone micronaut-jdbc-sqlite module — the Micronaut SQL docs recommend this exact
    // pairing. db-type: sqlite in application.yml is what tells Micronaut which driver to
    // load from the URL prefix.
    runtimeOnly 'org.xerial:sqlite-jdbc:3.46.1.0'

    testImplementation 'io.micronaut:micronaut-http-client'
    testImplementation 'io.micronaut.test:micronaut-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.mockito:mockito-core'
}

application {
    mainClass = 'com.jilali.Application'
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.WARN
}

java {
    sourceCompatibility = JavaVersion.toVersion('25')
    targetCompatibility = JavaVersion.toVersion('25')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--enable-preview']
}

// StructuredTaskScope (RoomJoinService) is still preview API in Java 25 GA — classes compiled
// with --enable-preview fail to *load* at runtime without it too, not just at compile time.
tasks.withType(Test).configureEach {
    jvmArgs('--enable-preview')
}

tasks.named('run') {
    jvmArgs('--enable-preview')
}

micronaut {
    runtime 'netty'
    testRuntime 'junit5'
    processing {
        incremental true
        annotations 'com.jilali.*'
    }
}

